{% extends "staff/base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        <i class="bi bi-person-circle"></i>
                        Edit Profile
                    </h3>

                </div>

                <div class="card-body p-4">

                    <form action="/staff/profile" method="POST">

                        <div class="text-center mb-4">

                            <h4 class="mt-3">{{ staff.user.name }}</h4>

                            <p class="text-muted">
                                {{ staff.user.email }}
                            </p>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       name="name"
                                       value="{{ staff.user.name }}"
                                       required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       name="email"
                                       value="{{ staff.user.email }}"
                                       required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input type="text"
                                       class="form-control"
                                       name="phone"
                                       value="{{ staff.user.phone }}">

                            </div>

                            

                        </div>

                        

                        <hr>

                        <h5 class="mb-3">
                            Change Password
                        </h5>

                        <div class="mb-3">

                            <label class="form-label">
                                Current Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   name="current_pwd">

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    New Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       name="new_pwd">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       name="cnf_pwd">

                            </div>

                        </div>

                        <div class="d-flex justify-content-between mt-4">

                            <a href="/staff/dashboard"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Cancel

                            </a>

                            <button class="btn btn-primary px-4">

                                <i class="bi bi-check-circle"></i>
                                Save Changes

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
