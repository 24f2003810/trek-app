<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Staff Dashboard
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="d-flex">

    <!-- ================= Sidebar ================= -->

    <div class="sidebar bg-white border-end" style="width:250px; min-height:100vh;">

        <div class="text-center py-4 border-bottom">
            <h5>Trekking Management</h5>
        </div>

        <ul class="nav flex-column mt-3">

            <li class="nav-item">
                <a class="nav-link {% if active_page=='dashboard' %}active{% endif %}"
                   href="/staff/dashboard">
                    <i class="bi bi-house-door me-2"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if active_page=='treks' %}active{% endif %}"
                   href="/staff/my_treks">
                    <i class="bi bi-signpost me-2"></i>
                    My Treks
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if active_page=='participants' %}active{% endif %}"
                   href="/staff/participants">
                    <i class="bi bi-people me-2"></i>
                    Participants
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if active_page=='profile' %}active{% endif %}"
                   href="/staff/profile">
                    <i class="bi bi-person me-2"></i>
                    Profile
                </a>
            </li>

            <li class="nav-item mt-3">
                <a class="nav-link text-danger" href="/logout">
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- ================= Main Section ================= -->

    <div class="flex-grow-1">

        <!-- ================= Navbar ================= -->

        <nav class="navbar navbar-expand-lg bg-white border-bottom px-4">

            <div class="container-fluid">

                <span class="navbar-brand fw-bold">
                    Trekking Management Application
                </span>

                <div class="dropdown">

                    <button class="btn btn-light dropdown-toggle"
                            data-bs-toggle="dropdown">

                        <i class="bi bi-person-circle me-2"></i>

                        {{ session.get("name") }}

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>
                            <a class="dropdown-item"
                               href="/staff/profile">

                                Profile

                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               href="/logout">

                                Logout

                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

        <!-- ================= Page Content ================= -->

        <div class="container-fluid p-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
